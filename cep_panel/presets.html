<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Starfield Presets</title><link rel="stylesheet" href="css/presets.css"></head>
<body>
  <header><img src="assets/starfield-presets-banner.png" alt="Starfield Presets"><div><h1>Preset Library</h1><p id="target">Select a layer with Starfield in After Effects.</p></div><button id="refresh">Refresh Target</button></header>
  <div class="search-row"><label for="search">Search</label><input id="search" type="search" placeholder="Search presets and categories" autocomplete="off"><button id="import">Import…</button><button id="save">Save Current…</button></div>
  <nav aria-label="Library navigation"><button id="home">All presets</button><span id="breadcrumb">Categories</span></nav>
  <main><div id="grid" role="list" aria-label="Preset library"></div><aside id="details"><canvas id="preview" width="420" height="240" aria-label="Preset illustration"></canvas><h2 id="selected-title">Choose a preset</h2><p id="description">Browse a category or search the library. Add keeps the current nodes; Replace creates the selected setup.</p><p id="structure"></p></aside></main>
  <div id="status" role="status" aria-live="polite">Loading library…</div>
  <footer><label><input id="render-settings" type="checkbox" checked>Apply Render Settings</label><span id="note">Your current effect stays pinned until Refresh Target.</span><button id="cancel">Cancel</button><button id="replace" disabled>Replace</button><button id="add" class="primary" disabled>Add</button></footer>
  <script src="js/graph_codec.js"></script><script src="js/graph_layout.js"></script><script src="js/graph_edits.js"></script><script src="js/graph_view.js"></script><script src="js/native_graph_snapshot.js"></script><script src="js/graph_transactions.js"></script><script src="js/presets.js"></script><script src="js/preset_manager.js"></script>
</body></html>
