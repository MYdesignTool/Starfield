<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Starfield Node Editor</title>
  <link rel="stylesheet" href="css/panel.css" />
</head>
<body>
  <header class="bar">
    <div class="title">Starfield Node Editor</div>
    <div class="sub" id="targetLine">No target</div>
  </header>

  <div id="banner" class="banner hidden" role="status"></div>

  <section class="toolbar">
    <label for="preset">Example</label>
    <select id="preset">
      <option value="">Custom</option>
      <option value="spark">Spark</option>
      <option value="snow">Snow</option>
      <option value="floating_light">Floating Light</option>
      <option value="defaults">Reset Defaults</option>
    </select>
    <button id="refresh" type="button">Refresh</button>
    <label class="auto-refresh" title="Poll the selected AE layer and effect while the panel is open">
      <input id="autoRefresh" type="checkbox" checked /> Refresh Automatically
    </label>
  </section>

  <main id="workspace" class="workspace">
    <section class="graph-pane" aria-label="Particle graph">
      <div class="section-heading">
        <span>Graph</span>
        <span class="section-note">Fixed chain · select a node to edit</span>
      </div>
      <div class="graph-scroll">
        <div class="graph-canvas">
          <svg id="graphEdges" class="graph-edges" viewBox="0 0 580 320" aria-hidden="true">
            <defs>
              <marker id="edgeArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                <path d="M0 0 L6 3 L0 6 Z" />
              </marker>
            </defs>
            <g id="edgePaths"></g>
          </svg>
          <div id="chain" class="graph-nodes" aria-label="Emitter to force to appearance to output chain">
            <p class="hint">Select one layer carrying Starfield Particle.</p>
          </div>
        </div>
      </div>
    </section>
    <aside id="inspector" class="floating-inspector" aria-label="Selected node parameters" hidden>
      <div id="inspectorDrag" class="inspector-head">
        <div class="inspector-heading">
          <span id="inspectorTitle">Node</span>
          <span id="inspectorMeta" class="section-note"></span>
        </div>
        <button id="closeInspector" class="inspector-close" type="button" aria-label="Close node properties">×</button>
      </div>
      <div id="inspectorBody" class="inspector-body">
        <p class="hint">Select a node to inspect its parameters.</p>
      </div>
    </aside>
  </main>

  <footer class="bar footer">
    <span id="modeLine">Mode: -</span>
    <span id="revisionLine">Revision: -</span>
    <span id="resolutionLine" title="How effect parameters were resolved on the host">Lookup: -</span>
  </footer>

  <script src="js/panel.js"></script>
</body>
</html>
