<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Starfield Node Editor</title>
  <link rel="stylesheet" href="css/panel.css?v=39" />
</head>
<body>
  <header class="bar">
    <div class="title">Starfield Node Editor</div>
    <div class="target-row">
      <div class="sub" id="targetLine">No target</div>
      <button id="targetLock" type="button" aria-pressed="false" title="Keep this effect targeted when AE selection changes">Pin Target</button>
    </div>
  </header>

  <div id="banner" class="banner hidden" role="status"></div>

  <section class="toolbar">
    <button id="refresh" type="button">Refresh</button>
    <button id="openPresets" type="button">Presets…</button>
    <label class="auto-refresh" title="Poll the selected AE layer and effect while the panel is open">
      <input id="autoRefresh" type="checkbox" checked /> Refresh Automatically
    </label>
  </section>

  <main id="workspace" class="workspace">
    <section class="graph-pane" aria-label="Particle graph">
      <div class="section-heading">
        <span>Graph</span>
        <span class="graph-tools"><span class="section-note">Drag nodes · drag empty space to select</span><span id="zoomReadout">100%</span></span>
      </div>
      <div id="graphScroll" class="graph-scroll" tabindex="-1">
        <div id="graphViewport" class="graph-viewport">
          <div class="graph-canvas">
          <svg id="graphEdges" class="graph-edges" viewBox="0 0 580 320" role="group" aria-label="Graph connections">
            <defs>
              <marker id="edgeArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                <path d="M0 0 L6 3 L0 6 Z" />
              </marker>
            </defs>
            <g id="edgePaths"></g>
          </svg>
          <div id="chain" class="graph-nodes" aria-label="Emitter to Particle to Force to Output flow">
            <p class="hint">Select one layer carrying Starfield Particle.</p>
          </div>
          <div id="selectionBox" class="selection-box" hidden></div>
          </div>
          <canvas id="graphMinimap" class="graph-minimap" width="192" height="120"
                  role="application" aria-label="Node minimap; click or drag to navigate"
                  title="Node map · click or drag to navigate"></canvas>
        </div>
      </div>
    </section>
    <aside id="inspector" class="floating-inspector" aria-label="Selected node parameters" hidden>
      <div id="inspectorDrag" class="inspector-head">
        <div class="inspector-heading">
          <span id="inspectorTitle">Node</span>
          <span id="inspectorMeta" class="section-note"></span>
        </div>
        <button id="closeInspector" class="inspector-close" type="button" aria-label="Close node properties">×</button>
      </div>
      <div id="inspectorBody" class="inspector-body">
        <p class="hint">Select a node to inspect its parameters.</p>
      </div>
    </aside>
  </main>

  <footer class="bar footer">
    <span id="modeLine">Mode: -</span>
    <span id="revisionLine">Revision: -</span>
    <span id="resolutionLine" title="How effect parameters were resolved on the host">Lookup: -</span>
  </footer>

  <div id="graphContextMenu" class="graph-context-menu" role="menu" aria-label="Node graph actions" hidden>
    <div class="context-menu-heading">Add Node</div>
    <button type="button" role="menuitem" data-action="addNode" data-node-type="emitter">Emitter</button>
    <button type="button" role="menuitem" data-action="addNode" data-node-type="auxiliary">Auxiliary</button>
    <button type="button" role="menuitem" data-action="addNode" data-node-type="particle">Particle</button>
    <button type="button" role="menuitem" data-action="addNode" data-node-type="force">Force</button>
    <div class="context-menu-separator"></div>
    <button type="button" role="menuitem" data-action="duplicateNodes">Duplicate Selected <span>Ctrl+D</span></button>
    <button type="button" role="menuitem" data-action="deleteNodes">Delete Selected <span>Del / Backspace</span></button>
    <button id="disconnectContextAction" type="button" role="menuitem" data-action="disconnect" hidden>Disconnect This Wire</button>
  </div>

  <script src="js/graph_codec.js?v=39"></script>
  <script src="js/graph_layout.js?v=39"></script>
  <script src="js/graph_edits.js?v=39"></script>
  <script src="js/native_graph_snapshot.js?v=39"></script>
  <script src="js/graph_transactions.js?v=39"></script>
  <script src="js/graph_view.js?v=39"></script>
    <script src="js/gradient_editor.js?v=39"></script>
    <script src="js/panel.js?v=39"></script>
</body>
</html>
