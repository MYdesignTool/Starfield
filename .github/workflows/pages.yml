name: Starfield website

on:
  push:
    branches: [main]
    paths:
      - docs/site/**
      - tests/website-check.cjs
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - docs/site/**
      - tests/website-check.cjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate website and publication boundary
        run: node tests/website-check.cjs
      - name: Upload website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
